name: Build and Release Mac Mouse Fix

on:
  push:
    branches:
      - master
      - codex/macos27-fixes
    tags:
      - "macos27-v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the build as a prerelease
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag (required when publishing)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal release app
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      APP_PATH: ${{ github.workspace }}/build/Build/Products/Release/Mac Mouse Fix.app
      OUTPUT_DIR: ${{ github.workspace }}/artifacts
      ZIP_PATH: ${{ github.workspace }}/artifacts/MacMouseFixApp.zip

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show remote toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Validate release inputs
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^macos27-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag must match macos27-v<semver>" >&2
            exit 1
          fi

      - name: Build release app
        run: |
          xcodebuild \
            -project "Mouse Fix.xcodeproj" \
            -scheme "App - Release" \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Verify and package app
        run: |
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/Mac Mouse Fix" | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 "

          mkdir -p "$OUTPUT_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" > "$ZIP_PATH.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: MacMouseFix-${{ github.sha }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.ZIP_PATH }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/macos27-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="$MANUAL_TAG"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$ZIP_PATH" "$ZIP_PATH.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$ZIP_PATH" "$ZIP_PATH.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mac Mouse Fix $RELEASE_TAG" \
              --notes "Community build containing the macOS 27 DockSwipe fixes." \
              --prerelease
          fi
