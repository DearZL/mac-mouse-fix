name: Build and Release Mac Mouse Fix

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tag:
    name: Verify tag points to master HEAD
    runs-on: ubuntu-latest
    outputs:
      matches_master: ${{ steps.verify.outputs.matches_master }}

    steps:
      - name: Check out tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare tag commit with master HEAD
        id: verify
        run: |
          git fetch --no-tags origin master

          TAG_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          MASTER_HEAD="$(git rev-parse origin/master)"

          echo "Tag commit:  $TAG_COMMIT"
          echo "master HEAD: $MASTER_HEAD"

          if [[ "$TAG_COMMIT" == "$MASTER_HEAD" ]]; then
            echo "matches_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches_master=false" >> "$GITHUB_OUTPUT"
            echo "Skipping build because the tag does not point to master HEAD."
          fi

  build:
    name: Build universal release app
    needs: validate-tag
    if: needs.validate-tag.outputs.matches_master == 'true'
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      APP_PATH: ${{ github.workspace }}/build/Build/Products/Release/Mac Mouse Fix.app
      OUTPUT_DIR: ${{ github.workspace }}/artifacts
      ZIP_PATH: ${{ github.workspace }}/artifacts/MacMouseFixApp.zip

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show remote toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build release app
        run: |
          xcodebuild \
            -project "Mouse Fix.xcodeproj" \
            -scheme "App - Release" \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Prepare ad-hoc distribution signature
        run: |
          HELPER_PATH="$APP_PATH/Contents/Library/LoginItems/Mac Mouse Fix Helper.app"

          # Xcode preserves keychain-access-groups from the development entitlements. macOS kills an
          # ad-hoc signed binary carrying that restricted entitlement before launch, so strip it from
          # both executable bundles and then seal the outer app again. Do not enable hardened runtime:
          # without a Developer Team it rejects the embedded Sparkle framework at dyld launch time.
          codesign --force --sign - --timestamp=none "$HELPER_PATH"
          codesign --force --sign - --timestamp=none "$APP_PATH"

          if codesign -d --entitlements :- "$APP_PATH" 2>&1 | grep -q keychain-access-groups; then
            echo "Main app still contains restricted keychain entitlements" >&2
            exit 1
          fi
          if codesign -d --entitlements :- "$HELPER_PATH" 2>&1 | grep -q keychain-access-groups; then
            echo "Helper still contains restricted keychain entitlements" >&2
            exit 1
          fi

      - name: Smoke test app launch
        run: |
          LOG_PATH="$RUNNER_TEMP/mac-mouse-fix-smoke.log"
          "$APP_PATH/Contents/MacOS/Mac Mouse Fix" > "$LOG_PATH" 2>&1 &
          APP_PID=$!
          sleep 5

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            wait "$APP_PID" || STATUS=$?
            cat "$LOG_PATH"
            echo "Mac Mouse Fix exited during launch smoke test with status ${STATUS:-0}" >&2
            exit 1
          fi

          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true

      - name: Verify and package app
        run: |
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/Mac Mouse Fix" | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 "

          mkdir -p "$OUTPUT_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" > "$ZIP_PATH.sha256"
          printf '%s\n' \
            'This community build is ad-hoc signed and cannot be notarized without an Apple Developer ID.' \
            'After extracting MacMouseFixApp.zip, run:' \
            '  xattr -dr com.apple.quarantine "Mac Mouse Fix.app"' \
            'Then open the app normally.' \
            > "$OUTPUT_DIR/INSTALL.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: MacMouseFix-${{ github.sha }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.ZIP_PATH }}.sha256
            ${{ env.OUTPUT_DIR }}/INSTALL.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${GITHUB_REF#refs/tags/}"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$ZIP_PATH" "$ZIP_PATH.sha256" "$OUTPUT_DIR/INSTALL.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$ZIP_PATH" "$ZIP_PATH.sha256" "$OUTPUT_DIR/INSTALL.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mac Mouse Fix $RELEASE_TAG" \
              --notes "Community build containing the macOS 27 DockSwipe fixes." \
              --prerelease
          fi
